name: Hospital Management System CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "0000"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Gives MySQL service container a moment to safely initialize 
    - name: Wait for MySQL to be ready
      run: sleep 10

    # Installed mysql-client to run the local injection securely
    - name: Initialize MySQL Database
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client
        mysql -h 127.0.0.1 -u root -p"0000" < project.sql

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # ✅ Fixed property name

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mysql-connector-python flake8

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Verify Python Script Compilation
      run: |
        python -m py_compile project.py
